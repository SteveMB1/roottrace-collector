          ROOTTRACE_CASSANDRA_CONTACT_POINTS={{ roottrace_cassandra_contact_points }}
          ROOTTRACE_CASSANDRA_USERNAME={{ roottrace_cassandra_username }}
          ROOTTRACE_CASSANDRA_PASSWORD={{ roottrace_cassandra_password }}
          ROOTTRACE_NGINX_LOG_ACCESS={{ roottrace_nginx_log_access | string | lower }}
          ROOTTRACE_NGINX_STATUS_URLS={{ roottrace_nginx_status_urls }}
          ROOTTRACE_NGINX_USERNAME={{ roottrace_nginx_username }}
          ROOTTRACE_NGINX_PASSWORD={{ roottrace_nginx_password }}
          ROOTTRACE_NGINX_ACCESS_LOG_PATHS={{ roottrace_nginx_access_log_paths }}
          ROOTTRACE_NGINX_ERROR_LOG_PATHS={{ roottrace_nginx_error_log_paths }}
          ROOTTRACE_APACHE_STATUS_URLS={{ roottrace_apache_status_urls }}
