---
- name: Install RootTrace read-only collector
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Required, and deliberately empty: set roottrace_api_url to this
    # deployment's own /api base so a forgotten value can never send host
    # diagnostics somewhere the operator did not choose.
    roottrace_api_url: ""
    roottrace_interval_seconds: 60
    roottrace_max_runtime_seconds: 86400
    roottrace_streaming: "false"
    roottrace_enabled_checks: "disk,inode,disk_io,swap,memory,cpu,network,tcp,process,systemd,kernel,linux_audit,ec2,collector_self,custom"
    roottrace_kernel_journal_access: true
    roottrace_selinux_nis_enabled: true
    roottrace_linux_audit_enabled: true
    roottrace_linux_audit_access: true
    roottrace_linux_audit_log_paths: /var/log/audit/audit.log
    roottrace_linux_audit_batch_events: 250
    roottrace_linux_audit_streaming: false
    roottrace_linux_audit_auditd_plugin: true
    roottrace_linux_audit_stig_rules: false
    roottrace_linux_audit_backlog_limit: 8192
    roottrace_linux_audit_backlog_wait_time: 0
    roottrace_linux_audit_rules_dir: /etc/audit/rules.d
    roottrace_linux_audit_plugin_dir: ""
    roottrace_linux_audit_plugin_flush_seconds: 2
    roottrace_linux_audit_plugin_minimal_host: true
    roottrace_linux_audit_reload_auditd: true
    roottrace_linux_audit_max_bytes_per_cycle: 4194304
    roottrace_linux_audit_initial_lookback_bytes: 1048576
    roottrace_linux_audit_resolve_users: true
    roottrace_linux_audit_uid_cache_size: 4096
    roottrace_install_dir: /opt/roottrace-collector
    roottrace_state_dir: /var/lib/roottrace-collector
    roottrace_config_dir: /etc/roottrace
    roottrace_collector_user: roottrace-collector
    roottrace_service_name: ""
    roottrace_service_type: ""
    roottrace_check_ports: ""
    roottrace_process_names: ""
    roottrace_systemd_units: ""
    roottrace_docker_api_check: "false"
    roottrace_docker_socket: ""
    roottrace_disk_paths: ""
    roottrace_mongodb_uri: ""
    roottrace_mongodb_targets: ""
    roottrace_postgres_dsn: ""
    roottrace_postgres_targets: ""
    roottrace_postgres_username: ""
    roottrace_postgres_password: ""
    roottrace_mysql_dsn: ""
    roottrace_mysql_targets: ""
    roottrace_mysql_username: ""
    roottrace_mysql_password: ""
    roottrace_redis_targets: ""
    roottrace_redis_password: ""
    roottrace_rabbitmq_api_url: ""
    roottrace_rabbitmq_username: ""
    roottrace_rabbitmq_password: ""
    roottrace_rabbitmq_vhost: ""
    roottrace_elasticsearch_urls: ""
    roottrace_elasticsearch_username: ""
    roottrace_elasticsearch_password: ""
    roottrace_clickhouse_urls: ""
    roottrace_clickhouse_username: ""
    roottrace_clickhouse_password: ""
    roottrace_cassandra_contact_points: ""
    roottrace_cassandra_username: ""
    roottrace_cassandra_password: ""
    roottrace_nginx_log_access: true
    roottrace_nginx_access_log_paths: ""
    roottrace_nginx_error_log_paths: ""
    roottrace_nginx_status_urls: ""
    roottrace_nginx_username: ""
    roottrace_nginx_password: ""
    roottrace_apache_status_urls: ""
    roottrace_apache_username: ""
    roottrace_apache_password: ""
    roottrace_haproxy_stats_urls: ""
    roottrace_haproxy_username: ""
    roottrace_haproxy_password: ""
    roottrace_eks_cluster_name: ""
    roottrace_custom_metrics_paths: "{{ roottrace_install_dir }}/additional_monitors,/etc/roottrace/custom_metrics.d"
    roottrace_custom_metrics_max_files: 16
    roottrace_keda_kubeconfig: ""
    roottrace_kubeconfig: ""
    roottrace_kubeconfig_context: ""
    roottrace_keda_kubeconfig_access: true
    roottrace_keda_kubeconfig_default_paths:
      - /etc/roottrace/kubeconfig
      - /etc/kubernetes/admin.conf
      - /etc/kubernetes/kubelet.conf
      - /etc/rancher/k3s/k3s.yaml
      - /etc/rancher/rke2/rke2.yaml
      - /var/snap/microk8s/current/credentials/client.config
    roottrace_extra_env: {}

  pre_tasks:
    - name: Require API URL
      ansible.builtin.assert:
        that:
          - roottrace_api_url is defined
          - roottrace_api_url is match('^https?://')
        fail_msg: >-
          roottrace_api_url is required and must be an absolute http or https
          URL, for example https://roottrace.example.com/api.

    - name: Require collector token
      ansible.builtin.assert:
        that:
          - roottrace_collector_token is defined
          - roottrace_collector_token | length > 0
        fail_msg: roottrace_collector_token is required.
      no_log: true

    - name: Check python3 exists
      ansible.builtin.command: python3 --version
      changed_when: false

  tasks:
    - name: Create collector group
      ansible.builtin.group:
        name: "{{ roottrace_collector_user }}"
        system: true

    - name: Create collector user
      ansible.builtin.user:
        name: "{{ roottrace_collector_user }}"
        group: "{{ roottrace_collector_user }}"
        home: "{{ roottrace_state_dir }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: true

    - name: Check systemd journal group
      ansible.builtin.command: getent group systemd-journal
      register: roottrace_systemd_journal_group
      changed_when: false
      failed_when: false

    - name: Check adm journal group
      ansible.builtin.command: getent group adm
      register: roottrace_adm_group
      changed_when: false
      failed_when: false

    - name: Build service-scoped journal groups
      ansible.builtin.set_fact:
        roottrace_journal_groups: >-
          {{
            []
            if not (roottrace_kernel_journal_access | bool)
            else
            (['systemd-journal'] if roottrace_systemd_journal_group.rc == 0 else
             (['adm'] if roottrace_adm_group.rc == 0 else []))
          }}

    - name: Create collector directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ roottrace_install_dir }}", owner: root, group: root, mode: "0755" }
        - { path: "{{ roottrace_state_dir }}", owner: "{{ roottrace_collector_user }}", group: "{{ roottrace_collector_user }}", mode: "0750" }
        - { path: "{{ roottrace_config_dir }}", owner: root, group: root, mode: "0755" }

    - name: Check SELinux nis_enabled boolean
      ansible.builtin.command:
        argv:
          - getsebool
          - nis_enabled
      register: roottrace_selinux_nis_enabled_state
      changed_when: false
      failed_when: false
      when: roottrace_selinux_nis_enabled | bool

    - name: Enable SELinux nis_enabled boolean for RootTrace audit identity lookups
      ansible.builtin.command:
        argv:
          - setsebool
          - -P
          - nis_enabled
          - "1"
      when:
        - roottrace_selinux_nis_enabled | bool
        - roottrace_selinux_nis_enabled_state.rc | default(1) == 0
        - "'--> on' not in (roottrace_selinux_nis_enabled_state.stdout | default(''))"
      register: roottrace_selinux_nis_set
      changed_when: roottrace_selinux_nis_set.rc == 0
      failed_when: false

    - name: Check POSIX ACL support
      ansible.builtin.command: setfacl --version
      register: roottrace_setfacl
      changed_when: false
      failed_when: false
      when: (roottrace_nginx_log_access | bool) or (roottrace_linux_audit_access | bool) or (roottrace_keda_kubeconfig_access | bool)

    - name: Check default Nginx log directory
      ansible.builtin.stat:
        path: /var/log/nginx
        follow: false
      register: roottrace_nginx_log_dir
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0

    - name: Grant collector traversal on Nginx log directory
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:--x"
          - /var/log/nginx
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - roottrace_nginx_log_dir.stat.isdir | default(false)
        - not (roottrace_nginx_log_dir.stat.islnk | default(false))

    - name: Grant read-only default ACL for future Nginx logs
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "d:u:{{ roottrace_collector_user }}:r--"
          - /var/log/nginx
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - roottrace_nginx_log_dir.stat.isdir | default(false)
        - not (roottrace_nginx_log_dir.stat.islnk | default(false))

    - name: Find existing default Nginx logs
      ansible.builtin.find:
        paths: /var/log/nginx
        patterns:
          - access.log
          - access.log.1
          - error.log
          - error.log.1
        file_type: file
        recurse: false
        follow: false
      register: roottrace_nginx_default_logs
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - roottrace_nginx_log_dir.stat.isdir | default(false)

    - name: Grant read-only ACL on existing default Nginx logs
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:r--"
          - "{{ item.path }}"
      loop: "{{ roottrace_nginx_default_logs.files | default([]) }}"
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - not (item.islnk | default(false))

    - name: Build configured Nginx log ACL list
      ansible.builtin.set_fact:
        roottrace_nginx_configured_logs: "{{ ((roottrace_nginx_access_log_paths | default('')) + ',' + (roottrace_nginx_error_log_paths | default(''))).split(',') | map('trim') | reject('equalto', '') | list }}"
      when: roottrace_nginx_log_access | bool

    - name: Check configured Nginx log files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ roottrace_nginx_configured_logs | default([]) }}"
      register: roottrace_nginx_configured_log_stats
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0

    - name: Grant collector traversal on configured Nginx log directories
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:--x"
          - "{{ item.stat.path | dirname }}"
      loop: "{{ roottrace_nginx_configured_log_stats.results | default([]) }}"
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Grant read-only default ACL on configured Nginx log directories
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "d:u:{{ roottrace_collector_user }}:r--"
          - "{{ item.stat.path | dirname }}"
      loop: "{{ roottrace_nginx_configured_log_stats.results | default([]) }}"
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Grant read-only ACL on configured Nginx logs
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:r--"
          - "{{ item.stat.path }}"
      loop: "{{ roottrace_nginx_configured_log_stats.results | default([]) }}"
      when:
        - roottrace_nginx_log_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Check default Linux audit log directory
      ansible.builtin.stat:
        path: /var/log/audit
        follow: false
      register: roottrace_linux_audit_log_dir
      when:
        - roottrace_linux_audit_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0

    - name: Grant collector traversal on Linux audit log directory
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:--x"
          - /var/log/audit
      when:
        - roottrace_linux_audit_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - roottrace_linux_audit_log_dir.stat.isdir | default(false)
        - not (roottrace_linux_audit_log_dir.stat.islnk | default(false))

    - name: Grant read-only default ACL for future Linux audit logs
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "d:u:{{ roottrace_collector_user }}:r--"
          - /var/log/audit
      when:
        - roottrace_linux_audit_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - roottrace_linux_audit_log_dir.stat.isdir | default(false)
        - not (roottrace_linux_audit_log_dir.stat.islnk | default(false))

    - name: Build configured Linux audit log ACL list
      ansible.builtin.set_fact:
        roottrace_linux_audit_configured_logs: "{{ (roottrace_linux_audit_log_paths | default('/var/log/audit/audit.log')).split(',') | map('trim') | reject('equalto', '') | list }}"
      when: roottrace_linux_audit_access | bool

    - name: Check configured Linux audit log files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ roottrace_linux_audit_configured_logs | default([]) }}"
      register: roottrace_linux_audit_configured_log_stats
      when:
        - roottrace_linux_audit_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0

    - name: Grant collector traversal on configured Linux audit log directories
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:--x"
          - "{{ item.stat.path | dirname }}"
      loop: "{{ roottrace_linux_audit_configured_log_stats.results | default([]) }}"
      when:
        - roottrace_linux_audit_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Grant read-only ACL on configured Linux audit logs
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:r--"
          - "{{ item.stat.path }}"
      loop: "{{ roottrace_linux_audit_configured_log_stats.results | default([]) }}"
      when:
        - roottrace_linux_audit_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Build Kubernetes kubeconfig ACL list
      ansible.builtin.set_fact:
        roottrace_keda_kubeconfig_acl_paths: "{{ ([roottrace_keda_kubeconfig, roottrace_kubeconfig, roottrace_extra_env.get('ROOTTRACE_KEDA_KUBECONFIG', ''), roottrace_extra_env.get('ROOTTRACE_KUBERNETES_KUBECONFIG', ''), roottrace_extra_env.get('ROOTTRACE_KUBECONFIG', ''), roottrace_extra_env.get('KUBECONFIG', '')] + roottrace_keda_kubeconfig_default_paths) | map('trim') | reject('equalto', '') | unique | list }}"
      when: roottrace_keda_kubeconfig_access | bool

    - name: Check Kubernetes kubeconfig ACL targets
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ roottrace_keda_kubeconfig_acl_paths | default([]) }}"
      register: roottrace_keda_kubeconfig_stats
      when:
        - roottrace_keda_kubeconfig_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0

    - name: Grant collector traversal on Kubernetes kubeconfig directories
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:--x"
          - "{{ item.stat.path | dirname }}"
      loop: "{{ roottrace_keda_kubeconfig_stats.results | default([]) }}"
      when:
        - roottrace_keda_kubeconfig_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Grant read-only ACL on Kubernetes kubeconfig files
      ansible.builtin.command:
        argv:
          - setfacl
          - -m
          - "u:{{ roottrace_collector_user }}:r--"
          - "{{ item.stat.path }}"
      loop: "{{ roottrace_keda_kubeconfig_stats.results | default([]) }}"
      when:
        - roottrace_keda_kubeconfig_access | bool
        - (roottrace_setfacl.rc | default(1)) == 0
        - item.stat.exists | default(false)
        - item.stat.isreg | default(false)
        - not (item.stat.islnk | default(false))

    - name: Inspect bundled collector source beside bundle root
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../roottrace_collector.py"
      register: roottrace_collector_source_parent

    - name: Inspect bundled collector source beside playbook
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/roottrace_collector.py"
      register: roottrace_collector_source_local

    - name: Inspect bundled compiled collector artifacts
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../compiled"
      register: roottrace_compiled_collector_dir

    - name: Inspect bundled additional monitors
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../additional_monitors"
      register: roottrace_additional_monitors_dir

    - name: Require source or compiled collector runtime
      ansible.builtin.fail:
        msg: "Collector bundle must include roottrace_collector.py or compiled collector artifacts."
      when:
        - not (roottrace_collector_source_parent.stat.exists | default(false))
        - not (roottrace_collector_source_local.stat.exists | default(false))
        - not (roottrace_compiled_collector_dir.stat.isdir | default(false))

    - name: Install collector script from bundle root
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../roottrace_collector.py"
        dest: "{{ roottrace_install_dir }}/roottrace_collector.py"
        owner: root
        group: root
        mode: "0755"
      when: roottrace_collector_source_parent.stat.exists | default(false)

    - name: Install collector script from playbook directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/roottrace_collector.py"
        dest: "{{ roottrace_install_dir }}/roottrace_collector.py"
        owner: root
        group: root
        mode: "0755"
      when:
        - not (roottrace_collector_source_parent.stat.exists | default(false))
        - roottrace_collector_source_local.stat.exists | default(false)

    - name: Remove stale collector source for compiled-only bundle
      ansible.builtin.file:
        path: "{{ roottrace_install_dir }}/roottrace_collector.py"
        state: absent
      when:
        - not (roottrace_collector_source_parent.stat.exists | default(false))
        - not (roottrace_collector_source_local.stat.exists | default(false))
        - roottrace_compiled_collector_dir.stat.isdir | default(false)

    - name: Install collector launcher
      ansible.builtin.copy:
        src: "{{ lookup('first_found', {'files': [playbook_dir + '/../install/roottrace_collector_launcher.py', playbook_dir + '/roottrace_collector_launcher.py']}) }}"
        dest: "{{ roottrace_install_dir }}/roottrace_collector_launcher.py"
        owner: root
        group: root
        mode: "0755"

    - name: Install collector runtime wrapper
      ansible.builtin.copy:
        src: "{{ lookup('first_found', {'files': [playbook_dir + '/../install/run_collector.sh', playbook_dir + '/run_collector.sh']}) }}"
        dest: "{{ roottrace_install_dir }}/run_collector.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Install bundled compiled collector artifacts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compiled"
        dest: "{{ roottrace_install_dir }}/"
        owner: root
        group: root
        mode: preserve
      when: roottrace_compiled_collector_dir.stat.isdir | default(false)

    - name: Remove stale compiled collector artifacts when source bundle has none
      ansible.builtin.file:
        path: "{{ roottrace_install_dir }}/compiled"
        state: absent
      when: not (roottrace_compiled_collector_dir.stat.isdir | default(false))

    - name: Install bundled additional monitors
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../additional_monitors"
        dest: "{{ roottrace_install_dir }}/"
        owner: root
        group: root
        mode: preserve
      when: roottrace_additional_monitors_dir.stat.isdir | default(false)

    - name: Remove stale additional monitors when bundle has none
      ansible.builtin.file:
        path: "{{ roottrace_install_dir }}/additional_monitors"
        state: absent
      when: not (roottrace_additional_monitors_dir.stat.isdir | default(false))

    - name: Write collector environment file
      ansible.builtin.copy:
        dest: "{{ roottrace_config_dir }}/collector.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          ROOTTRACE_API_URL={{ roottrace_api_url }}
          ROOTTRACE_COLLECTOR_TOKEN={{ roottrace_collector_token }}
          ROOTTRACE_INTERVAL_SECONDS={{ roottrace_interval_seconds }}
          ROOTTRACE_MAX_RUNTIME_SECONDS={{ roottrace_max_runtime_seconds }}
          ROOTTRACE_STREAMING={{ roottrace_streaming }}
          ROOTTRACE_ENABLED_CHECKS={{ roottrace_enabled_checks }}
          ROOTTRACE_KERNEL_JOURNAL_ACCESS={{ roottrace_kernel_journal_access | string | lower }}
          ROOTTRACE_LINUX_AUDIT_ENABLED={{ roottrace_linux_audit_enabled | string | lower }}
          ROOTTRACE_LINUX_AUDIT_ACCESS={{ roottrace_linux_audit_access | string | lower }}
          ROOTTRACE_LINUX_AUDIT_LOG_PATHS={{ roottrace_linux_audit_log_paths }}
          ROOTTRACE_LINUX_AUDIT_BATCH_EVENTS={{ roottrace_linux_audit_batch_events }}
          ROOTTRACE_LINUX_AUDIT_STREAMING={{ roottrace_linux_audit_streaming | string | lower }}
          ROOTTRACE_LINUX_AUDIT_AUDITD_PLUGIN={{ roottrace_linux_audit_auditd_plugin | string | lower }}
          ROOTTRACE_LINUX_AUDIT_STIG_RULES={{ roottrace_linux_audit_stig_rules | string | lower }}
          ROOTTRACE_LINUX_AUDIT_BACKLOG_LIMIT={{ roottrace_linux_audit_backlog_limit }}
          ROOTTRACE_LINUX_AUDIT_BACKLOG_WAIT_TIME={{ roottrace_linux_audit_backlog_wait_time }}
          ROOTTRACE_LINUX_AUDIT_RULES_DIR={{ roottrace_linux_audit_rules_dir }}
          ROOTTRACE_LINUX_AUDIT_PLUGIN_FLUSH_SECONDS={{ roottrace_linux_audit_plugin_flush_seconds }}
          ROOTTRACE_LINUX_AUDIT_PLUGIN_MINIMAL_HOST={{ roottrace_linux_audit_plugin_minimal_host | string | lower }}
          ROOTTRACE_LINUX_AUDIT_RELOAD_AUDITD={{ roottrace_linux_audit_reload_auditd | string | lower }}
          ROOTTRACE_LINUX_AUDIT_MAX_BYTES_PER_CYCLE={{ roottrace_linux_audit_max_bytes_per_cycle }}
          ROOTTRACE_LINUX_AUDIT_INITIAL_LOOKBACK_BYTES={{ roottrace_linux_audit_initial_lookback_bytes }}
          ROOTTRACE_LINUX_AUDIT_RESOLVE_USERS={{ roottrace_linux_audit_resolve_users | string | lower }}
          ROOTTRACE_LINUX_AUDIT_UID_CACHE_SIZE={{ roottrace_linux_audit_uid_cache_size }}
          ROOTTRACE_CUSTOM_METRICS_PATHS={{ roottrace_custom_metrics_paths }}
          ROOTTRACE_CUSTOM_METRICS_MAX_FILES={{ roottrace_custom_metrics_max_files }}
          ROOTTRACE_SERVICE_NAME={{ roottrace_service_name }}
          ROOTTRACE_SERVICE_TYPE={{ roottrace_service_type }}
          ROOTTRACE_CHECK_PORTS={{ roottrace_check_ports }}
          ROOTTRACE_PROCESS_NAMES={{ roottrace_process_names }}
          ROOTTRACE_SYSTEMD_UNITS={{ roottrace_systemd_units }}
          ROOTTRACE_DOCKER_API_CHECK={{ roottrace_docker_api_check }}
          ROOTTRACE_DOCKER_SOCKET={{ roottrace_docker_socket }}
          ROOTTRACE_DISK_PATHS={{ roottrace_disk_paths }}
          ROOTTRACE_MONGODB_URI={{ roottrace_mongodb_uri }}
          ROOTTRACE_MONGODB_TARGETS={{ roottrace_mongodb_targets }}
          ROOTTRACE_POSTGRES_DSN={{ roottrace_postgres_dsn }}
          ROOTTRACE_POSTGRES_TARGETS={{ roottrace_postgres_targets }}
