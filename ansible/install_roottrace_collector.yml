          ROOTTRACE_MYSQL_DSN={{ roottrace_mysql_dsn }}
          ROOTTRACE_MYSQL_TARGETS={{ roottrace_mysql_targets }}
          ROOTTRACE_MYSQL_USERNAME={{ roottrace_mysql_username }}
          ROOTTRACE_MYSQL_PASSWORD={{ roottrace_mysql_password }}
          ROOTTRACE_REDIS_TARGETS={{ roottrace_redis_targets }}
          ROOTTRACE_REDIS_PASSWORD={{ roottrace_redis_password }}
          ROOTTRACE_RABBITMQ_API_URL={{ roottrace_rabbitmq_api_url }}
          ROOTTRACE_RABBITMQ_USERNAME={{ roottrace_rabbitmq_username }}
          ROOTTRACE_RABBITMQ_PASSWORD={{ roottrace_rabbitmq_password }}
          ROOTTRACE_RABBITMQ_VHOST={{ roottrace_rabbitmq_vhost }}
          ROOTTRACE_ELASTICSEARCH_URLS={{ roottrace_elasticsearch_urls }}
          ROOTTRACE_ELASTICSEARCH_USERNAME={{ roottrace_elasticsearch_username }}
          ROOTTRACE_ELASTICSEARCH_PASSWORD={{ roottrace_elasticsearch_password }}
          ROOTTRACE_CLICKHOUSE_URLS={{ roottrace_clickhouse_urls }}
          ROOTTRACE_CLICKHOUSE_USERNAME={{ roottrace_clickhouse_username }}
