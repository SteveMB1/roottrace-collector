          ROOTTRACE_HAPROXY_STATS_URLS={{ roottrace_haproxy_stats_urls }}
          ROOTTRACE_HAPROXY_USERNAME={{ roottrace_haproxy_username }}
          ROOTTRACE_HAPROXY_PASSWORD={{ roottrace_haproxy_password }}
          ROOTTRACE_EKS_CLUSTER_NAME={{ roottrace_eks_cluster_name }}
          ROOTTRACE_KEDA_KUBECONFIG={{ roottrace_keda_kubeconfig }}
          ROOTTRACE_KUBECONFIG={{ roottrace_kubeconfig }}
          ROOTTRACE_KUBECONFIG_CONTEXT={{ roottrace_kubeconfig_context }}
          {% for key, value in roottrace_extra_env.items() %}
          {{ key }}={{ value }}
          {% endfor %}
      no_log: true

    - name: Ensure RootTrace Linux audit rules directory exists
      ansible.builtin.file:
        path: "{{ roottrace_linux_audit_rules_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool

    - name: Remove legacy RootTrace command execution audit rules
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ roottrace_linux_audit_rules_dir }}/roottrace-command-exec.rules"
        - "{{ roottrace_linux_audit_rules_dir }}/20-roottrace-command-exec.rules"
      when:
        - roottrace_linux_audit_enabled | bool

    - name: Install RootTrace RHEL 9 STIG audit reset rules
      ansible.builtin.copy:
        dest: "{{ roottrace_linux_audit_rules_dir }}/00-roottrace-rhel9-stig-reset.rules"
        owner: root
        group: root
        mode: "0640"
        content: |
          ## RootTrace RHEL 9 STIG V2R8 audit reset rules.
          ## Keep augenrules reloads idempotent by clearing active audit rules before loading the generated ruleset.
          -D
          ## Raise the kernel audit backlog buffer well above the default of 64 so bursty
          ## workloads (yum/dnf, package installs) do not fill the queue and get throttled.
          -b {{ roottrace_linux_audit_backlog_limit }}
          ## Do not block syscalls waiting for the audit queue to drain (0 = drop under
          ## extreme burst instead of pausing the process). Set >0 to prefer completeness.
          --backlog_wait_time {{ roottrace_linux_audit_backlog_wait_time }}
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool

    - name: Install RootTrace RHEL 9 STIG audit rules
      ansible.builtin.shell: |
        set -eu
        rule_file="{{ roottrace_linux_audit_rules_dir }}/30-roottrace-rhel9-stig.rules"
        audit_native_arch() {
          case "$(uname -m 2>/dev/null || true)" in
            x86_64|amd64|aarch64|arm64|ppc64|ppc64le|s390x|riscv64) echo "b64" ;;
            *)
              if [ "$(getconf LONG_BIT 2>/dev/null || echo 64)" = "32" ]; then
                echo "b32"
              else
                echo "b64"
              fi
              ;;
          esac
        }
        audit_syscall_supported() {
          syscall_name="$1"
          if command -v ausyscall >/dev/null 2>&1; then
            ausyscall --exact "$syscall_name" >/dev/null 2>&1 && return 0
            if ausyscall --help 2>&1 | grep -q -- '--exact'; then
              return 1
            fi
            if ausyscall --dump 2>/dev/null | awk -v syscall_name="$syscall_name" '$2 == syscall_name { found = 1 } END { exit found ? 0 : 1 }'; then
              return 0
            fi
            return 1
          fi
          return 1
        }
        audit_syscall_equivalents() {
          case "$1" in
            chmod) echo "fchmodat fchmodat2" ;;
            chown|lchown) echo "fchownat" ;;
            rename) echo "renameat renameat2" ;;
            unlink|rmdir) echo "unlinkat" ;;
            open|creat) echo "openat openat2" ;;
            umount) echo "umount2" ;;
            *) return 1 ;;
          esac
        }
        append_audit_syscall_rule() {
          rule_id="$1"
          syscall_names="$2"
          filters="$3"
          audit_arch="${ROOTTRACE_LINUX_AUDIT_ARCH:-$(audit_native_arch)}"
          supported_syscalls=""
          for syscall_name in $(printf '%s\n' "$syscall_names" | tr ',' ' '); do
            if audit_syscall_supported "$syscall_name"; then
              case " ${supported_syscalls} " in
                *" ${syscall_name} "*) ;;
                *) supported_syscalls="${supported_syscalls}${supported_syscalls:+ }${syscall_name}" ;;
              esac
            else
              equivalent_syscalls=""
              for equivalent_syscall in $(audit_syscall_equivalents "$syscall_name" 2>/dev/null || true); do
                if audit_syscall_supported "$equivalent_syscall"; then
                  case " ${supported_syscalls} ${equivalent_syscalls} " in
                    *" ${equivalent_syscall} "*) ;;
                    *) equivalent_syscalls="${equivalent_syscalls}${equivalent_syscalls:+ }${equivalent_syscall}" ;;
                  esac
                fi
              done
              if [ -n "$equivalent_syscalls" ]; then
                echo "RootTrace: audit syscall ${syscall_name} is not available for ${rule_id} on $(uname -m 2>/dev/null || echo unknown); covering it with native syscall(s): ${equivalent_syscalls}." >&2
                for equivalent_syscall in $equivalent_syscalls; do
                  case " ${supported_syscalls} " in
                    *" ${equivalent_syscall} "*) ;;
                    *) supported_syscalls="${supported_syscalls}${supported_syscalls:+ }${equivalent_syscall}" ;;
                  esac
                done
              else
                echo "RootTrace: failed to add audit syscall ${syscall_name} for ${rule_id}: syscall is unsupported or could not be verified, and no supported native equivalent was found; skipping this syscall so auditd can continue to start." >&2
              fi
            fi
          done
          if [ -z "$supported_syscalls" ]; then
            echo "RootTrace: failed to add audit rule ${rule_id}: no listed syscalls or native equivalents are supported on this host; skipping this rule so auditd can continue to start." >&2
            return 0
          fi
          {
            printf '## %s\n' "$rule_id"
            printf -- '-a always,exit -F arch=%s' "$audit_arch"
            for syscall_name in $supported_syscalls; do
              printf ' -S %s' "$syscall_name"
            done
            printf ' %s\n' "$filters"
          } >> "$rule_file"
        }
        {
          echo "## RootTrace RHEL 9 STIG V2R8 audit rules."
          echo "## Syscall rules are generated for the host native audit arch and omit syscalls unsupported by this kernel audit table."
        } > "$rule_file"
        append_audit_syscall_rule "RHEL-09-654010 uid exec privilege" "execve" "-C uid!=euid -F euid=0 -k execpriv"
        append_audit_syscall_rule "RHEL-09-654010 gid exec privilege" "execve" "-C gid!=egid -F egid=0 -k execpriv"
        append_audit_syscall_rule "RHEL-09-654015 permission changes" "chmod,fchmod,fchmodat" "-F auid>=1000 -F auid!=unset -k perm_mod"
        append_audit_syscall_rule "RHEL-09-654020 ownership changes" "chown,fchown,fchownat,lchown" "-F auid>=1000 -F auid!=unset -k perm_mod"
        append_audit_syscall_rule "RHEL-09-654025 extended attribute changes by users" "setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr" "-F auid>=1000 -F auid!=unset -k perm_mod"
        append_audit_syscall_rule "RHEL-09-654025 extended attribute changes by root" "setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr" "-F auid=0 -k perm_mod"
        cat >> "$rule_file" <<'EOF'
          ## RHEL-09-654030
          -a always,exit -F path=/usr/bin/umount -F perm=x -F auid>=1000 -F auid!=unset -k privileged-mount
          ## RHEL-09-654035
          -a always,exit -F path=/usr/bin/chacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_mod
          ## RHEL-09-654040
          -a always,exit -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_mod
          ## RHEL-09-654045
          -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=unset -k perm_mod
          ## RHEL-09-654050
          -a always,exit -F path=/usr/sbin/semanage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654055
          -a always,exit -F path=/usr/sbin/setfiles -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654060
          -a always,exit -F path=/usr/sbin/setsebool -F perm=x -F auid>=1000 -F auid!=unset -F key=privileged
        EOF
        append_audit_syscall_rule "RHEL-09-654065 deletions" "rename,unlink,rmdir,renameat,unlinkat" "-F auid>=1000 -F auid!=unset -k delete"
        append_audit_syscall_rule "RHEL-09-654070 permission denied access" "truncate,ftruncate,creat,open,openat,open_by_handle_at" "-F exit=-EPERM -F auid>=1000 -F auid!=unset -k perm_access"
        append_audit_syscall_rule "RHEL-09-654070 access denied access" "truncate,ftruncate,creat,open,openat,open_by_handle_at" "-F exit=-EACCES -F auid>=1000 -F auid!=unset -k perm_access"
        append_audit_syscall_rule "RHEL-09-654075 module removal" "delete_module" "-F auid>=1000 -F auid!=unset -k module_chng"
        append_audit_syscall_rule "RHEL-09-654080 module loading" "init_module,finit_module" "-F auid>=1000 -F auid!=unset -k module_chng"
        cat >> "$rule_file" <<'EOF'
          ## RHEL-09-654085
          -a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-chage
          ## RHEL-09-654090
          -a always,exit -F path=/usr/bin/chsh -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd
          ## RHEL-09-654095
          -a always,exit -F path=/usr/bin/crontab -F perm=x -F auid>=1000 -F auid!=unset -k privileged-crontab
          ## RHEL-09-654100
          -a always,exit -F path=/usr/bin/gpasswd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-gpasswd
          ## RHEL-09-654105
          -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k modules
          ## RHEL-09-654110
          -a always,exit -F path=/usr/bin/newgrp -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd
          ## RHEL-09-654115
          -a always,exit -F path=/usr/sbin/pam_timestamp_check -F perm=x -F auid>=1000 -F auid!=unset -k privileged-pam_timestamp_check
          ## RHEL-09-654120
          -a always,exit -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
          ## RHEL-09-654125
          -a always,exit -F path=/usr/sbin/postdrop -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654130
          -a always,exit -F path=/usr/sbin/postqueue -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654135
          -a always,exit -F path=/usr/bin/ssh-agent -F perm=x -F auid>=1000 -F auid!=unset -k privileged-ssh
          ## RHEL-09-654140
          -a always,exit -F path=/usr/libexec/openssh/ssh-keysign -F perm=x -F auid>=1000 -F auid!=unset -k privileged-ssh
          ## RHEL-09-654145
          -a always,exit -F path=/usr/bin/su -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
          ## RHEL-09-654150
          -a always,exit -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd
          ## RHEL-09-654155
          -a always,exit -F path=/usr/bin/sudoedit -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd
          ## RHEL-09-654160
          -a always,exit -F path=/usr/sbin/unix_chkpwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654165
          -a always,exit -F path=/usr/sbin/unix_update -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654170
          -a always,exit -F path=/usr/sbin/userhelper -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix-update
          ## RHEL-09-654175
          -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k privileged-usermod
          ## RHEL-09-654180
          -a always,exit -F path=/usr/bin/mount -F perm=x -F auid>=1000 -F auid!=unset -k privileged-mount
          ## RHEL-09-654185
          -a always,exit -F path=/usr/sbin/init -F perm=x -F auid>=1000 -F auid!=unset -k privileged-init
          ## RHEL-09-654190
          -a always,exit -F path=/usr/sbin/poweroff -F perm=x -F auid>=1000 -F auid!=unset -k privileged-poweroff
          ## RHEL-09-654195
          -a always,exit -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=unset -k privileged-reboot
          ## RHEL-09-654200
          -a always,exit -F path=/usr/sbin/shutdown -F perm=x -F auid>=1000 -F auid!=unset -k privileged-shutdown
        EOF
        append_audit_syscall_rule "RHEL-09-654205 umount syscall" "umount" "-F auid>=1000 -F auid!=unset -k privileged-umount"
        append_audit_syscall_rule "RHEL-09-654210 umount2 syscall" "umount2" "-F auid>=1000 -F auid!=unset -k privileged-umount"
        cat >> "$rule_file" <<'EOF'
          ## RHEL-09-654215
          -w /etc/sudoers -p wa -k identity
          ## RHEL-09-654220
          -w /etc/sudoers.d/ -p wa -k identity
          ## RHEL-09-654225
          -w /etc/group -p wa -k identity
          ## RHEL-09-654230
          -w /etc/gshadow -p wa -k identity
          ## RHEL-09-654235
          -w /etc/security/opasswd -p wa -k identity
          ## RHEL-09-654240
          -w /etc/passwd -p wa -k identity
          ## RHEL-09-654245
          -w /etc/shadow -p wa -k identity
          ## RHEL-09-654250
          -w /var/log/faillock -p wa -k logins
          ## RHEL-09-654255
          -w /var/log/lastlog -p wa -k logins
          ## RHEL-09-654096
          -w /etc/cron.d/ -p wa -k cronjobs
          -w /var/spool/cron/ -p wa -k cronjobs
        EOF
        chown root:root "$rule_file"
        chmod 0640 "$rule_file"
      args:
        executable: /bin/sh
      register: roottrace_stig_audit_rules_install
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool

    - name: Show RootTrace STIG audit rules skipped for this architecture
      ansible.builtin.debug:
        msg: "{{ roottrace_stig_audit_rules_install.stderr_lines }}"
      when:
        - roottrace_stig_audit_rules_install is defined
        - (roottrace_stig_audit_rules_install.stderr_lines | default([])) | length > 0

    - name: Install RootTrace RHEL 9 STIG audit finalization rules
      ansible.builtin.copy:
        dest: "{{ roottrace_linux_audit_rules_dir }}/99-roottrace-rhel9-stig-finalize.rules"
        owner: root
        group: root
        mode: "0640"
        content: |
          ## RootTrace RHEL 9 STIG V2R8 audit finalization rules.
          ## RHEL-09-654265
          -f 2
          ## RHEL-09-654270
          --loginuid-immutable
          ## RHEL-09-654275
          -e 2
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool

    - name: Locate augenrules for RootTrace Linux audit rules
      ansible.builtin.shell: command -v augenrules
      register: roottrace_augenrules_path
      changed_when: false
      failed_when: false
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool

    - name: Locate auditctl for RootTrace Linux audit rules
      ansible.builtin.shell: command -v auditctl
      register: roottrace_auditctl_path
      changed_when: false
      failed_when: false
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool
        - (roottrace_augenrules_path.stdout | default('')) | length == 0

    - name: Check generated RootTrace Linux audit rules with augenrules
      ansible.builtin.command:
        argv:
          - "{{ roottrace_augenrules_path.stdout }}"
          - --check
      register: roottrace_augenrules_check
      changed_when: false
      failed_when: false
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool
        - (roottrace_augenrules_path.stdout | default('')) | length > 0

    - name: Disable generated RootTrace Linux audit rules when augenrules check fails
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ roottrace_linux_audit_rules_dir }}/00-roottrace-rhel9-stig-reset.rules"
        - "{{ roottrace_linux_audit_rules_dir }}/30-roottrace-rhel9-stig.rules"
        - "{{ roottrace_linux_audit_rules_dir }}/99-roottrace-rhel9-stig-finalize.rules"
      when:
        - roottrace_augenrules_check is defined
        - (roottrace_augenrules_check.rc | default(0)) != 0

    - name: Warn when RootTrace audit rules are disabled after augenrules check
      ansible.builtin.debug:
        msg: "RootTrace generated audit rules failed augenrules --check and were removed so auditd can continue to start. Review the earlier RootTrace audit-rule warnings for the unsupported rule or syscall."
      when:
        - roottrace_augenrules_check is defined
        - (roottrace_augenrules_check.rc | default(0)) != 0

    - name: Restart audit-rules.service for RootTrace Linux audit rules
      ansible.builtin.shell: |
        set -eu
        if ! command -v systemctl >/dev/null 2>&1; then
          exit 2
        fi
        load_state="$(systemctl show audit-rules.service -p LoadState --value 2>/dev/null || true)"
        if [ "$load_state" != "loaded" ]; then
          exit 2
        fi
        systemctl restart audit-rules.service
        result="$(systemctl show audit-rules.service -p Result --value 2>/dev/null || true)"
        exec_status="$(systemctl show audit-rules.service -p ExecMainStatus --value 2>/dev/null || true)"
        if [ "$result" = "success" ] && [ "$exec_status" = "0" ]; then
          echo "RootTrace: restarted audit-rules.service and confirmed audit rules loaded successfully."
          exit 0
        fi
        echo "RootTrace: audit-rules.service restart did not confirm success (Result=${result:-unknown}, ExecMainStatus=${exec_status:-unknown})." >&2
        exit 1
      args:
        executable: /bin/sh
      register: roottrace_audit_rules_service_restart
      changed_when: roottrace_audit_rules_service_restart.rc == 0
      failed_when: false
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_reload_auditd | bool
        - roottrace_linux_audit_stig_rules | bool
        - (roottrace_augenrules_check.rc | default(0)) == 0

    - name: Show audit-rules.service RootTrace confirmation
      ansible.builtin.debug:
        msg: "{{ roottrace_audit_rules_service_restart.stdout_lines }}"
      when:
        - roottrace_audit_rules_service_restart is defined
        - (roottrace_audit_rules_service_restart.rc | default(1)) == 0
        - (roottrace_audit_rules_service_restart.stdout_lines | default([])) | length > 0

    - name: Load RootTrace Linux audit rules with augenrules
      ansible.builtin.command:
        argv:
          - "{{ roottrace_augenrules_path.stdout }}"
          - --load
      register: roottrace_augenrules_load
      changed_when: false
      failed_when: false
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool
        - (roottrace_augenrules_path.stdout | default('')) | length > 0
        - (roottrace_augenrules_check.rc | default(0)) == 0
        - (roottrace_audit_rules_service_restart.rc | default(2)) != 0

    - name: Load RootTrace Linux audit rules with auditctl
      ansible.builtin.command:
        argv:
          - "{{ roottrace_auditctl_path.stdout }}"
          - -R
          - "{{ item.path }}"
      loop:
        - path: "{{ roottrace_linux_audit_rules_dir }}/30-roottrace-rhel9-stig.rules"
          enabled: "{{ roottrace_linux_audit_stig_rules | bool }}"
        - path: "{{ roottrace_linux_audit_rules_dir }}/99-roottrace-rhel9-stig-finalize.rules"
          enabled: "{{ roottrace_linux_audit_stig_rules | bool }}"
      register: roottrace_auditctl_load
      changed_when: false
      failed_when: false
      when:
        - roottrace_linux_audit_enabled | bool
        - item.enabled | bool
        - (roottrace_augenrules_path.stdout | default('')) | length == 0
        - (roottrace_auditctl_path.stdout | default('')) | length > 0
        - (roottrace_audit_rules_service_restart.rc | default(2)) != 0

    - name: Disable generated RootTrace Linux audit rules when immediate load fails
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ roottrace_linux_audit_rules_dir }}/00-roottrace-rhel9-stig-reset.rules"
        - "{{ roottrace_linux_audit_rules_dir }}/30-roottrace-rhel9-stig.rules"
        - "{{ roottrace_linux_audit_rules_dir }}/99-roottrace-rhel9-stig-finalize.rules"
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_stig_rules | bool
        - >
          (roottrace_augenrules_load.rc | default(0)) != 0 or
          ((roottrace_auditctl_load.results | default([])) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: Warn when generated RootTrace Linux audit rules are disabled after load failure
      ansible.builtin.debug:
        msg: "RootTrace could not load generated Linux audit rules immediately, so it removed the RootTrace-managed audit rule files instead of risking auditd startup."
      when:
        - roottrace_linux_audit_enabled | bool
        - >
          (roottrace_augenrules_load.rc | default(0)) != 0 or
          ((roottrace_auditctl_load.results | default([])) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: Inspect modern auditd plugin directory
      ansible.builtin.stat:
        path: /etc/audit/plugins.d
      register: roottrace_audit_plugin_dir
      when: roottrace_linux_audit_enabled | bool and roottrace_linux_audit_auditd_plugin | bool

    - name: Inspect modern auditd configuration directory
      ansible.builtin.stat:
        path: /etc/audit
      register: roottrace_audit_config_dir
      when: roottrace_linux_audit_enabled | bool and roottrace_linux_audit_auditd_plugin | bool

    - name: Inspect legacy audisp plugin directory
      ansible.builtin.stat:
        path: /etc/audisp/plugins.d
      register: roottrace_audisp_plugin_dir
      when: roottrace_linux_audit_enabled | bool and roottrace_linux_audit_auditd_plugin | bool

    - name: Inspect legacy audisp configuration directory
      ansible.builtin.stat:
        path: /etc/audisp
      register: roottrace_audisp_config_dir
      when: roottrace_linux_audit_enabled | bool and roottrace_linux_audit_auditd_plugin | bool

    - name: Select configured auditd plugin directory
      ansible.builtin.set_fact:
        roottrace_effective_auditd_plugin_dir: "{{ roottrace_linux_audit_plugin_dir }}"
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_auditd_plugin | bool
        - roottrace_linux_audit_plugin_dir | length > 0

    - name: Select modern auditd plugin directory
      ansible.builtin.set_fact:
        roottrace_effective_auditd_plugin_dir: /etc/audit/plugins.d
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_auditd_plugin | bool
        - roottrace_linux_audit_plugin_dir | length == 0
        - roottrace_effective_auditd_plugin_dir is not defined
        - (roottrace_audit_plugin_dir.stat.isdir | default(false)) or (roottrace_audit_config_dir.stat.isdir | default(false))

    - name: Select legacy audisp plugin directory
      ansible.builtin.set_fact:
        roottrace_effective_auditd_plugin_dir: /etc/audisp/plugins.d
      when:
        - roottrace_linux_audit_enabled | bool
        - roottrace_linux_audit_auditd_plugin | bool
        - roottrace_linux_audit_plugin_dir | length == 0
        - roottrace_effective_auditd_plugin_dir is not defined
        - (roottrace_audisp_plugin_dir.stat.isdir | default(false)) or (roottrace_audisp_config_dir.stat.isdir | default(false))

    - name: Ensure RootTrace auditd plugin directory exists
      ansible.builtin.file:
        path: "{{ roottrace_effective_auditd_plugin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: roottrace_effective_auditd_plugin_dir is defined

    - name: Locate python3 for RootTrace auditd plugin
      ansible.builtin.command: command -v python3
      register: roottrace_python3_path
      changed_when: false
      failed_when: false
      when: roottrace_effective_auditd_plugin_dir is defined

    - name: Install RootTrace auditd plugin wrapper
      ansible.builtin.copy:
        dest: "{{ roottrace_install_dir }}/roottrace_auditd_plugin.sh"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          # Keep this auditd child side-effect free under SELinux auditd_t.
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONUNBUFFERED=1
          export ROOTTRACE_LINUX_AUDIT_PLUGIN_MINIMAL_HOST=true
          exec "{{ roottrace_install_dir }}/run_collector.sh" --env-file "{{ roottrace_config_dir }}/collector.env" --auditd-plugin
      when:
        - roottrace_effective_auditd_plugin_dir is defined
        - (roottrace_python3_path.stdout | default('')) | length > 0
      no_log: true

    - name: Install RootTrace auditd plugin configuration
      ansible.builtin.copy:
        dest: "{{ roottrace_effective_auditd_plugin_dir }}/roottrace.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          active = yes
          direction = out
          path = {{ roottrace_install_dir }}/roottrace_auditd_plugin.sh
          type = always
          format = string
      when: roottrace_effective_auditd_plugin_dir is defined

    - name: Reload auditd for RootTrace plugin
      ansible.builtin.command: service auditd reload
      changed_when: false
      failed_when: false
      when:
        - roottrace_effective_auditd_plugin_dir is defined
        - roottrace_linux_audit_reload_auditd | bool

    - name: Install systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/roottrace-collector.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=RootTrace read-only diagnostics collector
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ roottrace_collector_user }}
          Group={{ roottrace_collector_user }}
          {% if roottrace_journal_groups | length > 0 %}
          SupplementaryGroups={{ roottrace_journal_groups | join(' ') }}
          {% endif %}
          EnvironmentFile={{ roottrace_config_dir }}/collector.env
          ExecStart={{ roottrace_install_dir }}/run_collector.sh --loop
          RuntimeMaxSec={{ roottrace_max_runtime_seconds }}
          Restart=always
          RestartSec=15
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          ReadWritePaths={{ roottrace_state_dir }}
          CapabilityBoundingSet=
          AmbientCapabilities=
          LockPersonality=true
          RestrictSUIDSGID=true
          SystemCallArchitectures=native
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start collector
      ansible.builtin.systemd:
        name: roottrace-collector.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Remove retired collector updater
      ansible.builtin.file:
        path: "{{ roottrace_install_dir }}/update_collector.sh"
        state: absent
